<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bear Pulls Bulb Wire</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="room" id="room">

    <!-- CEILING -->
    <div class="ceiling"></div>


    <!-- DOOR AREA -->
    <div class="door-area">

        <!-- BEAR -->
        <div class="bear" id="bear">

            <!-- Bear Head -->
            <div class="bear-head">

                <div class="ear left"></div>
                <div class="ear right"></div>

                <div class="eye left"></div>
                <div class="eye right"></div>

                <div class="nose"></div>
                <div class="mouth"></div>

            </div>


            <!-- Bear Body -->
            <div class="bear-body"></div>


            <!-- Connected Arm -->
            <div class="bear-arm" id="bearArm">

                <div class="paw" id="paw"></div>

            </div>

        </div>


        <!-- Door Frame -->
        <div class="door-frame"></div>


        <!-- Door -->
        <div class="door" id="door">

            <div class="door-handle"></div>

        </div>

    </div>


    <!-- BULB SUPPORT -->
    <div class="bulb-support"></div>


    <!-- BULB -->
    <div class="bulb">

        <!-- Glow -->
        <div class="bulb-glow"></div>


        <!-- Glass -->
        <div class="bulb-glass">

            <div class="filament"></div>

        </div>


        <!-- Cap -->
        <div class="bulb-cap">

            <div class="bulb-connector"></div>

        </div>

    </div>


    <!-- PULL WIRE -->
    <div class="pull-wire" id="pullWire">

        <div class="pull-handle" id="pullHandle"></div>

    </div>


    <!-- FLOOR -->
    <div class="floor"></div>


    <!-- DARK OVERLAY -->
    <div class="dark-overlay"></div>


    <!-- INSTRUCTION -->
    <div class="instruction" id="instruction">
        Pull the bulb wire down
    </div>
    <!-- STATUS -->
    <div class="status" id="status">
        Bear pulled the wire!
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
